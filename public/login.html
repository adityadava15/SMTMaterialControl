<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SMT Material Control System</title>
    <link rel="icon" href="/img/SMT.png?v=5" type="image/png">

    <!-- Inter Font (Offline) -->
    <link rel="stylesheet" href="/libs/inter-font.css">

    <!-- Tailwind CSS (Offline) -->
    <script src="/libs/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#091540',
                            hover: '#142563',
                            active: '#060e2a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Compatibility classes for auth.js */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        /* Eye toggle button styling */
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #091540;
        }
    </style>
</head>

<body class="h-full bg-slate-50 flex items-center justify-center p-4 sm:p-6 text-slate-900">

    <!-- Background Decoration Grid Pattern -->
    <div class="fixed inset-0 pointer-events-none opacity-40 [background-image:radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:16px_16px]"></div>

    <!-- Login Card (Shadcn Card Component Style) -->
    <div class="relative w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">

        <!-- Header -->
        <div class="flex flex-col items-center text-center space-y-3">
            <div class="py-2.5 px-5 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center shadow-2xs">
                <img src="/img/SMT.png" alt="SMT Logo" class="h-14 sm:h-16 w-auto object-contain">
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">SMT Material Control</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Masuk untuk mengakses sistem inventori dan material</p>
            </div>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <!-- Username Input -->
            <div class="space-y-1.5">
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
                    Username
                </label>
                <input type="text" id="username" name="username"
                    class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200 bg-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#091540] focus:border-transparent transition shadow-2xs"
                    placeholder="Masukkan username" required autocomplete="username">
            </div>

            <!-- Password Input -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
                        Password
                    </label>
                </div>
                <div class="relative w-full">
                    <input type="password" id="password" name="password"
                        class="w-full pl-3.5 pr-11 py-2.5 text-sm rounded-lg border border-slate-200 bg-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#091540] focus:border-transparent transition shadow-2xs"
                        placeholder="Masukkan password" required autocomplete="current-password">
                    <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Tampilkan password">
                        <!-- Eye Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="eye-icon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Eye Off Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="eye-off-icon" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error/Success Message Alert -->
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <!-- Submit Button (#091540 Brand Color) -->
            <button type="submit"
                class="btn btn-primary w-full py-2.5 px-4 rounded-lg bg-[#091540] hover:bg-[#142563] active:bg-[#060e2a] text-white font-medium text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
                <span>Masuk</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center text-[11px] text-slate-400">
            SMT Material Control &bull; v1.0.0
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
</body>

</html>
