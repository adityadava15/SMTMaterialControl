<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SMT Material Control System</title>
    <link rel="icon" href="/img/SMT.png?v=5" type="image/png">
    <!-- Inter Font (Offline) -->
    <link rel="stylesheet" href="/libs/inter-font.css">
    <link rel="stylesheet" href="/css/login-wave.css">
</head>

<body>
    <main class="wave-login-screen">
        <!-- Left Organic Wave with Color-Corrected SMT Production Line Photo -->
        <div class="wave-landscape-container" aria-hidden="true">
            <svg class="wave-landscape-svg" viewBox="0 0 746 810" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="smtWaveClip">
                        <path d="M 0 0 L 568 0 C 648 56 746 138 746 222 C 746 320 536 445 536 548 C 536 582 558 596 556 628 C 553 686 442 758 336 810 L 0 810 L 0 0 Z" />
                    </clipPath>
                    <linearGradient id="smtWaveFallbackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#060E2B" />
                        <stop offset="55%" stop-color="#091540" />
                        <stop offset="100%" stop-color="#142563" />
                    </linearGradient>
                    <!-- Color Correction Filter matching Figma -->
                    <filter id="smtNavyColorGrade" color-interpolation-filters="sRGB">
                        <feColorMatrix type="saturate" values="0.78" result="desat" />
                        <feComponentTransfer in="desat" result="contrast">
                            <feFuncR type="linear" slope="1.06" intercept="-0.04" />
                            <feFuncG type="linear" slope="1.12" intercept="-0.03" />
                            <feFuncB type="linear" slope="1.24" intercept="0.02" />
                        </feComponentTransfer>
                    </filter>
                </defs>

                <g clip-path="url(#smtWaveClip)">
                    <rect x="0" y="0" width="746" height="810" fill="url(#smtWaveFallbackGrad)" />
                    <image
                        id="waveBgImage"
                        href="/img/WhatsApp%20Image%202026-11-23%20at%2011.21.03.jpeg"
                        x="-160"
                        y="0"
                        width="1080"
                        height="810"
                        preserveAspectRatio="xMidYMid slice"
                        filter="url(#smtNavyColorGrade)"
                        onerror="this.style.display='none'"
                    />
                    <!-- Soft-Light Navy Overlay (22%) -->
                    <rect x="0" y="0" width="746" height="810" fill="#091540" fill-opacity="0.22" style="mix-blend-mode: soft-light;" />
                    <!-- Normal Navy Theme Tint Overlay (12%) -->
                    <rect x="0" y="0" width="746" height="810" fill="#091540" fill-opacity="0.12" />
                </g>
            </svg>
        </div>

        <!-- Decorative Wave Dot -->
        <div class="decorative-wave-dot" aria-hidden="true"></div>

        <!-- Abstract Background Accents behind Login Card -->
        <svg class="abstract-accents-svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="topWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#091540" stop-opacity="0.055" />
                    <stop offset="100%" stop-color="#1E408A" stop-opacity="0.015" />
                </linearGradient>
                <linearGradient id="bottomBlobGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#091540" stop-opacity="0.05" />
                    <stop offset="100%" stop-color="#1E408A" stop-opacity="0.015" />
                </linearGradient>
            </defs>

            <!-- 1. Top-Right Organic Wave -->
            <path d="M 1110 0 C 1130 95 1215 130 1285 185 C 1355 240 1370 330 1440 360 L 1440 0 L 1110 0 Z" fill="url(#topWaveGrad)" />

            <!-- 2. Top-Right Contour Line -->
            <path d="M 1065 0 C 1090 120 1190 160 1265 220 C 1340 280 1355 375 1440 410" fill="none" stroke="#091540" stroke-opacity="0.07" stroke-width="1.5" />

            <!-- 3. Bottom-Right Organic Shape -->
            <path d="M 1175 615 C 1235 555 1335 570 1380 635 C 1425 700 1390 785 1310 810 C 1230 835 1135 795 1115 725 C 1095 655 1115 675 1175 615 Z" fill="url(#bottomBlobGrad)" />

            <!-- 4. Floating Soft Circle behind top-left of Login Card -->
            <circle cx="876" cy="136" r="52" fill="#091540" fill-opacity="0.04" />

            <!-- 5. Abstract Ring Accent -->
            <circle cx="773" cy="347" r="11" fill="none" stroke="#091540" stroke-opacity="0.11" stroke-width="2" />

            <!-- 6. Floating Right Dot -->
            <circle cx="1345" cy="477" r="9" fill="#091540" fill-opacity="0.08" />

            <!-- 7. Minimal Dot Matrix (4x3) behind bottom-left of Login Card -->
            <g fill="#091540" fill-opacity="0.13">
                <circle cx="844" cy="650" r="2" />
                <circle cx="860" cy="650" r="2" />
                <circle cx="876" cy="650" r="2" />
                <circle cx="892" cy="650" r="2" />
                <circle cx="844" cy="666" r="2" />
                <circle cx="860" cy="666" r="2" />
                <circle cx="876" cy="666" r="2" />
                <circle cx="892" cy="666" r="2" />
                <circle cx="844" cy="682" r="2" />
                <circle cx="860" cy="682" r="2" />
                <circle cx="876" cy="682" r="2" />
                <circle cx="892" cy="682" r="2" />
            </g>
        </svg>

        <!-- Login Card Stage -->
        <div class="login-card-stage">
            <section class="wave-login-card" aria-label="Form Login SMT">
                <header class="card-header">
                    <img class="smt-logo" src="/img/SMT.png" alt="SMT Logo" width="195" height="62">
                    <p class="card-subtitle">PLEASE <strong>LOGIN</strong> TO CONTINUE</p>
                </header>

                <div id="errorMessage" class="form-feedback" role="alert" style="display: none;"></div>

                <form id="loginForm" class="wave-login-form">
                    <div class="fields-stack">
                        <div class="input-group">
                            <label class="sr-only" for="username">Username</label>
                            <input
                                class="underline-input"
                                id="username"
                                name="username"
                                type="text"
                                placeholder="Username"
                                autocomplete="username"
                                required
                                autofocus
                            >
                        </div>

                        <div class="input-group">
                            <label class="sr-only" for="password">Password</label>
                            <input
                                class="underline-input"
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                class="toggle-password-btn"
                                type="button"
                                id="togglePassword"
                                aria-label="Tampilkan password"
                                title="Hide / Show Password"
                            >
                                <!-- Eye Icon (Hidden password state) -->
                                <svg class="eye-icon" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M10 3C5.8 3 2.3 5.6 1 9.2C2.3 12.8 5.8 15.4 10 15.4C14.2 15.4 17.7 12.8 19 9.2C17.7 5.6 14.2 3 10 3ZM10 13.2C7.8 13.2 6 11.4 6 9.2C6 7 7.8 5.2 10 5.2C12.2 5.2 14 7 14 9.2C14 11.4 12.2 13.2 10 13.2ZM10 6.8C8.7 6.8 7.6 7.9 7.6 9.2C7.6 10.5 8.7 11.6 10 11.6C11.3 11.6 12.4 10.5 12.4 9.2C12.4 7.9 11.3 6.8 10 6.8Z" fill="#141414" />
                                    <line x1="3" y1="2" x2="17" y2="15" stroke="#141414" stroke-width="2" stroke-linecap="round" />
                                </svg>
                                <!-- Eye Visible Icon -->
                                <svg class="eye-off-icon" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display: none;">
                                    <path d="M10 3C5.8 3 2.3 5.6 1 9.2C2.3 12.8 5.8 15.4 10 15.4C14.2 15.4 17.7 12.8 19 9.2C17.7 5.6 14.2 3 10 3ZM10 13.2C7.8 13.2 6 11.4 6 9.2C6 7 7.8 5.2 10 5.2C12.2 5.2 14 7 14 9.2C14 11.4 12.2 13.2 10 13.2ZM10 6.8C8.7 6.8 7.6 7.9 7.6 9.2C7.6 10.5 8.7 11.6 10 11.6C11.3 11.6 12.4 10.5 12.4 9.2C12.4 7.9 11.3 6.8 10 6.8Z" fill="#141414" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button id="signInBtn" class="btn-sign-in" type="submit">SIGN IN</button>
                        <p class="signup-prompt">SMT Material Control &bull; v1.0.0</p>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
</body>

</html>
